name: Native platform services

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
    defaults:
      run:
        shell: bash
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      TZ: UTC0
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install SDL2 on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0
      - name: Install SDL2 on macOS
        if: runner.os == 'macOS'
        run: brew install sdl2
      - name: Install official SDL2 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'SDL2-2.32.10-win32-x64.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'quake3-platform-sdl2'
          Invoke-WebRequest 'https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10-win32-x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6cf9706eefd0a4a06dc764007934d428afaf029fabdd408a9e646048c91e18fb') { throw 'SDL2 archive checksum mismatch' }
          Expand-Archive $archive -DestinationPath $directory
          "QUAKE_SDL2_LIBRARY=$(Join-Path $directory 'SDL2.dll')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check native source and compiled services
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          mkdir -p platform-logs
          bun test tests/portable-calendar.test.ts tests/portable-console-runtime.test.ts tests/portable-file-native.test.ts tests/portable-windows-files.test.ts tests/portable-vfs-listing.test.ts < /dev/null 2>&1 | tee platform-logs/adapters.log
          bun run tools/platform-smoke.ts < /dev/null 2>&1 | tee platform-logs/source.log
          bun build --compile tools/platform-smoke.ts --outfile platform-logs/platform-smoke.exe 2>&1 | tee platform-logs/compile.log
          ./platform-logs/platform-smoke.exe < /dev/null 2>&1 | tee platform-logs/compiled.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-services-${{ matrix.runner }}
          path: platform-logs/*.log
          if-no-files-found: ignore
